<script>
// CALCULADORA CORREGIDA Y OPTIMIZADA
const precios = {
  original: {
    "30": { nombre: "Munich Original 30L", precio: 390000, litros: 30, recarga: 350000 },
    "50": { nombre: "Munich Original 50L", precio: 590000, litros: 50, recarga: 550000 }
  },
  ultra: {
    "30": { nombre: "Munich Ultra 30L", precio: 450000, litros: 30, recarga: 420000 }
    // Munich Ultra solo viene en presentación de 30L
  },
  manijas: { 0: 0, 20: 50000, 30: 75000, 50: 120000 }
};

let estado = { invitados: 25, duracion: 4, evento: 'tranqui', estilo: 'original', manijas: 0 };

document.getElementById('invitados').addEventListener('input', e => {
  estado.invitados = parseInt(e.target.value);
  document.getElementById('invitadosVal').textContent = estado.invitados;
  calcular();
});

document.querySelectorAll('[data-duracion]').forEach(btn => {
  btn.addEventListener('click', e => {
    document.querySelectorAll('[data-duracion]').forEach(b => b.classList.remove('active'));
    e.currentTarget.classList.add('active');
    estado.duracion = parseInt(e.currentTarget.dataset.duracion);
    calcular();
  });
});

document.querySelectorAll('[data-evento]').forEach(btn => {
  btn.addEventListener('click', e => {
    document.querySelectorAll('[data-evento]').forEach(b => b.classList.remove('active'));
    e.currentTarget.classList.add('active');
    estado.evento = e.currentTarget.dataset.evento;
    calcular();
  });
});

document.getElementById('estilo').addEventListener('change', e => {
  estado.estilo = e.target.value;
  calcular();
});

document.getElementById('manijas').addEventListener('change', e => {
  estado.manijas = parseInt(e.target.value);
  calcular();
});

function calcular() {
  let litrosBase = (estado.invitados * 0.5) * (estado.duracion / 2);
  if (estado.evento === 'fiesta' || estado.evento === 'casamiento') litrosBase *= 1.3;

  let catalogoActual = precios[estado.estilo] || precios.original;
  let barril;

  // Si se elige Munich Ultra, forzamos siempre el barril de 30L
  if (estado.estilo === 'ultra') {
    barril = catalogoActual["30"];
  } else {
    let barrilKey = litrosBase <= 30 ? "30" : "50";
    barril = catalogoActual[barrilKey];
  }

  // Lógica de recarga para eventos largos o de alta demanda
  let recarga = null;
  let precioRecarga = 0;

  if (estado.duracion > 6 || (estado.estilo === 'ultra' && litrosBase > 30)) {
    if (estado.estilo === 'ultra') {
      recarga = { nombre: "Recarga Munich Ultra 30L", precio: catalogoActual["30"].recarga, litros: 30 };
    } else {
      let recargaKey = estado.invitados < 50 ? "30" : "50";
      recarga = { nombre: `Recarga ${recargaKey}L`, precio: catalogoActual[recargaKey].recarga, litros: parseInt(recargaKey) };
    }
    precioRecarga = recarga.precio;
  }

  let precioManijas = precios.manijas[estado.manijas];
  let totalManijas = 20 + estado.manijas;
  let total = barril.precio + precioRecarga + precioManijas;
  let litrosTotales = barril.litros + (recarga ? recarga.litros : 0);

  document.getElementById('resultado').classList.add('activo');
  document.getElementById('barrilNombre').textContent = barril.nombre;
  document.getElementById('barrilPrecio').textContent = 'Gs. ' + barril.precio.toLocaleString('es-PY');

  if (recarga) {
    document.getElementById('recargaRow').style.display = 'flex';
    document.getElementById('recargaNombre').innerHTML = recarga.nombre + '<span class="badge-recarga">EVENTO LARGO</span>';
    document.getElementById('recargaPrecio').textContent = 'Gs. ' + recarga.precio.toLocaleString('es-PY');
  } else {
    document.getElementById('recargaRow').style.display = 'none';
  }

  if (estado.manijas > 0) {
    document.getElementById('manijasExtraRow').style.display = 'flex';
    let textoManijas = estado.manijas === 50 ? 'Pack x50 manijas' : `Pack x${estado.manijas} manijas`;
    if (estado.manijas === 50) textoManijas += '<span class="badge-ahorro">MEJOR PRECIO</span>';
    document.getElementById('manijasExtraTexto').innerHTML = textoManijas;
    document.getElementById('manijasExtraPrecio').textContent = 'Gs. ' + precioManijas.toLocaleString('es-PY');
  } else {
    document.getElementById('manijasExtraRow').style.display = 'none';
  }

  document.getElementById('totalPrecio').textContent = 'Gs. ' + total.toLocaleString('es-PY');
  let vasos = Math.round(litrosTotales / 0.5);
  document.getElementById('equivalencia').textContent = `${litrosTotales}L = ~${vasos} vasos de 500ml | Total ${totalManijas} manijas de vidrio`;

  let mensaje = `Hola Gaudel! 🍺%0AUsé la calculadora para Lambaré:%0A%0ABarril: ${barril.nombre} - Gs. ${barril.precio.toLocaleString('es-PY')}`;
  if (recarga) {
    mensaje += `%0A${recarga.nombre} - Gs. ${recarga.precio.toLocaleString('es-PY')}`;
  }
  mensaje += `%0AManijas: 20 incluidas`;
  if (estado.manijas > 0) {
    let detalleManijas = ` Pack x${estado.manijas}`;
    mensaje += ` ${detalleManijas} - Gs. ${precioManijas.toLocaleString('es-PY')}`;
  }
  mensaje += `%0ATotal: Gs. ${total.toLocaleString('es-PY')}%0A%0APara ${estado.invitados} personas x ${estado.duracion}hs%0A¿Tienen disponible?`;
  document.getElementById('btnWA').href = `https://wa.me/595973424269?text=${mensaje}`;
}

calcular();

// SCROLL SUAVE
document.querySelectorAll('a[href^="#"]').forEach(anchor => {
  anchor.addEventListener('click', function (e) {
    e.preventDefault();
    const target = document.querySelector(this.getAttribute('href'));
    if (target) target.scrollIntoView({ behavior: 'smooth' });
  });
});
</script>
